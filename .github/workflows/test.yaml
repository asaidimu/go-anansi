name: Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0-rc.1'
          cache: true

      - name: Get dependencies
        run: go mod download

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Go test (development env — fixtures use plain field IDs)
        run: make test

      - name: Go build
        run: go build -v ./...

      - name: TypeScript package tests (@asaidimu/anansi)
        working-directory: packages/anansi
        run: bun test

      - name: TypeScript typecheck + build
        working-directory: packages/anansi
        run: |
          bunx tsc --noEmit
          bun run build
